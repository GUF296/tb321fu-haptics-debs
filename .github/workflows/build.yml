name: Build TB321FU Haptics Debs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create/upload. Empty disables release upload.
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish a non-empty release tag as a prerelease without changing latest.
        required: true
        default: true
        type: boolean
      haptics_deb_version:
        description: Debian package version
        required: true
        default: 20260715.1
        type: string
      kernel_source_commit:
        description: Exact 40-hex GUF296/linux commit paired with the kernel SDK.
        required: true
        default: 5df8e852ea722929f5359a5ef28ebcec0c4443fd
        type: string
      kernel_build_archive:
        description: Kernel build SDK archive URL
        required: true
        default: https://github.com/GUF296/tb321fu-haptics-debs/releases/download/kernel-sdk-7.1.1-g5df8e852ea72/tb321fu-kernel-build-sdk-7.1.1-g5df8e852ea72.tar.gz
        type: string
      kernel_build_archive_sha256:
        description: SHA-256 of the exact kernel build SDK archive.
        required: true
        default: 75703c4cf2ed10777905d79c57103ce1a9e50a02d09507c4aa15eb81b27c845a
        type: string
      kernel_bundle_metadata:
        description: KERNEL-BUNDLE.tsv URL paired with the source and SDK; required for release publication.
        required: false
        default: ""
        type: string
      kernel_bundle_metadata_sha256:
        description: SHA-256 of KERNEL-BUNDLE.tsv; required when metadata is provided.
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag != '' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate workflow and lifecycle boundaries
        run: |
          set -euo pipefail
          python3 scripts/ci/check-workflow-input-boundaries.py --self-test
          python3 scripts/ci/check-workflow-input-boundaries.py .github/workflows/build.yml
          python3 scripts/ci/check-action-pins.py --self-test
          python3 scripts/ci/check-action-pins.py .github/workflows/build.yml
          python3 scripts/ci/test-kernel-bundle-metadata.py
          python3 scripts/ci/test-safe-extract-archive.py
          python3 scripts/ci/test-haptics-release-job-isolation.py --self-test
          python3 scripts/ci/test-haptics-release-job-isolation.py .github/workflows/build.yml
          bash scripts/ci/test-haptics-lifecycle.sh
          bash scripts/ci/test-haptics-provenance.sh
          bash scripts/ci/test-haptics-deb-contract.sh
          bash scripts/ci/test-release-publication.sh

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates git curl tar xz-utils zstd unzip rsync \
            make flex bison gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu kmod dpkg-dev

      - name: Validate build inputs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
          INPUT_HAPTICS_DEB_VERSION: ${{ inputs.haptics_deb_version }}
          INPUT_KERNEL_SOURCE_COMMIT: ${{ inputs.kernel_source_commit }}
          INPUT_KERNEL_BUILD_ARCHIVE: ${{ inputs.kernel_build_archive }}
          INPUT_KERNEL_BUILD_ARCHIVE_SHA256: ${{ inputs.kernel_build_archive_sha256 }}
          INPUT_KERNEL_BUNDLE_METADATA: ${{ inputs.kernel_bundle_metadata }}
          INPUT_KERNEL_BUNDLE_METADATA_SHA256: ${{ inputs.kernel_bundle_metadata_sha256 }}
        run: |
          set -euo pipefail
          . scripts/ci/common.sh
          if [ -n "$INPUT_RELEASE_TAG" ] && [ "$INPUT_PRERELEASE" != 1 ]; then
            echo 'Remediation releases must set prerelease=true.' >&2
            exit 1
          fi
          [[ "$INPUT_HAPTICS_DEB_VERSION" =~ ^[0-9][0-9A-Za-z.+~_-]{0,63}$ ]] || {
            echo 'unsafe haptics_deb_version' >&2
            exit 1
          }
          dpkg --validate-version "$INPUT_HAPTICS_DEB_VERSION"
          [[ "$INPUT_KERNEL_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'kernel_source_commit must be 40 lowercase hex characters' >&2
            exit 1
          }
          [[ "$INPUT_KERNEL_BUILD_ARCHIVE" =~ ^https://[^[:space:]]{1,2048}$ ]] || {
            echo 'kernel_build_archive must be a bounded HTTPS URL' >&2
            exit 1
          }
          [[ "$INPUT_KERNEL_BUILD_ARCHIVE_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo 'invalid kernel_build_archive_sha256' >&2
            exit 1
          }
          if [ -n "$INPUT_KERNEL_BUNDLE_METADATA" ] || [ -n "$INPUT_KERNEL_BUNDLE_METADATA_SHA256" ]; then
            [[ "$INPUT_KERNEL_BUNDLE_METADATA" =~ ^https://[^[:space:]]{1,2048}$ ]] || {
              echo 'kernel_bundle_metadata must be a bounded HTTPS URL' >&2
              exit 1
            }
            [[ "$INPUT_KERNEL_BUNDLE_METADATA_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {
              echo 'invalid kernel_bundle_metadata_sha256' >&2
              exit 1
            }
          fi
          if [ -n "$INPUT_RELEASE_TAG" ] && [ -z "$INPUT_KERNEL_BUNDLE_METADATA" ]; then
            echo 'release publication requires kernel_bundle_metadata and its SHA-256' >&2
            exit 1
          fi
          printf 'HAPTICS_DEB_VERSION=%s\n' "$INPUT_HAPTICS_DEB_VERSION" >> "$GITHUB_ENV"
          printf 'KERNEL_SOURCE_COMMIT=%s\n' "$INPUT_KERNEL_SOURCE_COMMIT" >> "$GITHUB_ENV"
          printf 'KERNEL_BUILD_ARCHIVE=%s\n' "$INPUT_KERNEL_BUILD_ARCHIVE" >> "$GITHUB_ENV"
          printf 'KERNEL_BUILD_ARCHIVE_SHA256=%s\n' "${INPUT_KERNEL_BUILD_ARCHIVE_SHA256,,}" >> "$GITHUB_ENV"
          printf 'KERNEL_BUNDLE_METADATA=%s\n' "$INPUT_KERNEL_BUNDLE_METADATA" >> "$GITHUB_ENV"
          printf 'KERNEL_BUNDLE_METADATA_SHA256=%s\n' "${INPUT_KERNEL_BUNDLE_METADATA_SHA256,,}" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(ci_git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build haptics deb
        run: |
          set -euo pipefail
          env \
            OUTPUT_DIR=out/tb321fu-haptics-debs \
            ARCH=arm64 \
            HAPTICS_DEB_VERSION="$HAPTICS_DEB_VERSION" \
            HAPTICS_STRIP=1 \
            HAPTICS_PRODUCER_COMMIT="$GITHUB_SHA" \
            KERNEL_SOURCE_COMMIT="$KERNEL_SOURCE_COMMIT" \
            KERNEL_BUILD_ARCHIVE="$KERNEL_BUILD_ARCHIVE" \
            KERNEL_BUILD_ARCHIVE_SHA256="$KERNEL_BUILD_ARCHIVE_SHA256" \
            KERNEL_BUNDLE_METADATA="$KERNEL_BUNDLE_METADATA" \
            KERNEL_BUNDLE_METADATA_SHA256="$KERNEL_BUNDLE_METADATA_SHA256" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            bash scripts/ci/build-tb321fu-haptics-deb-from-kernel-sdk.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tb321fu-haptics-debs-${{ inputs.haptics_deb_version }}-arm64
          path: out/tb321fu-haptics-debs/*

      - name: Stage release assets
        if: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          release_stage=out/tb321fu-haptics-release/release-staging
          release_dir="$release_stage/assets"
          notes="$release_dir/BUILD-PARAMETERS.md"
          compiled=out/tb321fu-haptics-debs/HAPTICS-COMPILED-DIGESTS.env
          module_sha256=$(awk -F= '$1 == "HAPTICS_MODULE_SHA256" { print $2 }' "$compiled")
          helper_sha256=$(awk -F= '$1 == "HAPTICS_HELPER_BINARY_SHA256" { print $2 }' "$compiled")
          archive_sha256=$(awk -F= '$1 == "HAPTICS_ARCHIVE_SHA256" { print $2 }' "$compiled")
          [[ "$module_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$helper_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$release_dir"
          {
            echo '# TB321FU Haptics Debs'
            echo
            echo "- Package version: $HAPTICS_DEB_VERSION"
            echo "- Kernel source commit: $KERNEL_SOURCE_COMMIT"
            echo "- Kernel SDK: $KERNEL_BUILD_ARCHIVE"
            echo "- Kernel SDK SHA-256: $KERNEL_BUILD_ARCHIVE_SHA256"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Haptics archive SHA-256: $archive_sha256"
            echo "- Candidate HAPTICS_MODULE_SHA256: $module_sha256"
            echo "- Candidate HAPTICS_HELPER_BINARY_SHA256: $helper_sha256"
            echo
            echo 'Static CI verifies package/lifecycle behavior; stop/suspend/resume remains a device gate.'
            echo 'Compiled digests require a byte-identical second trusted build and independent consumer pinning.'
          } > "$notes"
          install -m 0644 \
            "out/tb321fu-haptics-debs/tb321fu-haptics-debs_${HAPTICS_DEB_VERSION}_arm64.tar.gz" \
            out/tb321fu-haptics-debs/HAPTICS-SOURCE-LOCK.tsv \
            out/tb321fu-haptics-debs/SHA256SUMS-tb321fu-haptics-debs.txt \
            "$release_dir/"
          (
            cd "$release_dir"
            sha256sum -- \
              "tb321fu-haptics-debs_${HAPTICS_DEB_VERSION}_arm64.tar.gz" \
              HAPTICS-SOURCE-LOCK.tsv \
              SHA256SUMS-tb321fu-haptics-debs.txt \
              BUILD-PARAMETERS.md > SHA256SUMS.txt
          )

      - name: Upload staged release payload
        if: ${{ inputs.release_tag != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/tb321fu-haptics-release/release-staging
          if-no-files-found: error

  publish:
    if: ${{ inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download staged release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-staging

      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
            echo 'checked-out source does not match the workflow commit' >&2
            exit 1
          }
          release_dir=release-staging/assets
          notes=release-staging/assets/BUILD-PARAMETERS.md
          [ -d "$release_dir" ]
          [ -f "$notes" ]
          find "$release_dir" -maxdepth 1 -type f -print -quit | grep -q .
          bash scripts/ci/publish-release.sh "$RELEASE_TAG" "$release_dir" "$notes"
